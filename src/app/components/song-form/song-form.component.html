<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

  <!-- Breadcrumb / Header -->
  <div class="mb-6">
    <a routerLink="/songs" class="text-slate-400 hover:text-sky-400 text-sm transition">← Back to Song Library</a>
    <h1 class="text-3xl font-extrabold text-white mt-2">
      {{ isEditMode ? '✏️ Edit Song' : '➕ Add New Song' }}
    </h1>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-8">

    <!-- Basic Song Metadata -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-slate-200 border-b border-slate-800 pb-2">Song Details</h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Title -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Song Title *</label>
          <input
            type="text"
            [(ngModel)]="song.title"
            name="title"
            required
            placeholder="e.g. Tum Hi Ho"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
          />
        </div>

        <!-- Artist -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Artist *</label>
          <input
            type="text"
            [(ngModel)]="song.artist"
            name="artist"
            required
            placeholder="e.g. Arijit Singh"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
          />
        </div>

        <!-- Original Key & Scale Type -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Original Key & Scale</label>
          <div class="grid grid-cols-2 gap-2">
            <select
              [(ngModel)]="song.originalKey"
              name="originalKey"
              title="Key Root"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500"
            >
              <option *ngFor="let k of keys" [value]="k">{{ k }}</option>
            </select>
            <select
              [(ngModel)]="song.keyType"
              name="keyType"
              title="Scale Type"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500"
            >
              <option *ngFor="let t of keyTypes" [value]="t">{{ t }}</option>
            </select>
          </div>
        </div>

        <!-- BPM -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Tempo (BPM)</label>
          <input
            type="number"
            [(ngModel)]="song.bpm"
            name="bpm"
            min="30"
            max="300"
            placeholder="e.g. 94"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500"
          />
        </div>

        <!-- Duration & Time Signature -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Duration & Time Sig</label>
          <div class="grid grid-cols-2 gap-2">
            <input
              type="text"
              [(ngModel)]="song.duration"
              name="duration"
              placeholder="e.g. 4:30"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500"
            />
            <select
              [(ngModel)]="song.timeSignature"
              name="timeSignature"
              title="Time Signature"
              class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500"
            >
              <option *ngFor="let ts of timeSignatures" [value]="ts">{{ ts }}</option>
            </select>
          </div>
        </div>

        <!-- Genre -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Genre</label>
          <select
            [(ngModel)]="song.genre"
            name="genre"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-sky-500"
          >
            <option *ngFor="let g of genres" [value]="g">{{ g }}</option>
          </select>
        </div>

        <!-- Performance / Keyboard Notes -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Performance / Keyboard Notes</label>
          <input
            type="text"
            [(ngModel)]="song.notes"
            name="notes"
            placeholder="e.g. Grand Piano + Warm Pad on Chorus"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500"
          />
        </div>
      </div>
    </div>

    <!-- Lyrics & Chords (Editor + Live Preview) -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-lg font-bold text-slate-200">Lyrics & Chords (ChordPro Format)</h2>
        <span class="text-xs text-sky-400 font-mono">Tip: Put chords in brackets like [G], [Em7], [C/E]</span>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Editor Input -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">ChordPro Input</label>
          <textarea
            [(ngModel)]="song.lyricsAndChords"
            name="lyricsAndChords"
            rows="14"
            placeholder="[G]Hum tere bin [Em]ab reh nahi sakte&#10;[C]Tere bina kya [D]wajood mera..."
            class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-100 font-mono text-sm leading-relaxed placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
          ></textarea>
        </div>

        <!-- Live Preview Output -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Live Sheet Preview</label>
          <div
            class="w-full h-[330px] bg-slate-950/70 border border-slate-800/80 rounded-xl p-4 overflow-y-auto font-mono text-sm leading-normal text-slate-200"
            [innerHTML]="formatPreview(song.lyricsAndChords)"
          ></div>
        </div>
      </div>
    </div>

    <!-- Submit / Cancel Actions -->
    <div class="flex items-center justify-end space-x-4 pt-2">
      <a routerLink="/songs" class="px-6 py-2.5 rounded-xl border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-800 transition">
        Cancel
      </a>
      <button
        type="submit"
        [disabled]="isLoading"
        class="bg-sky-500 hover:bg-sky-400 disabled:opacity-50 text-slate-950 font-bold px-8 py-2.5 rounded-xl shadow-lg shadow-sky-500/20 transition flex items-center space-x-2"
      >
        <span *ngIf="isLoading" class="animate-spin mr-1">🔄</span>
        <span>{{ isEditMode ? 'Update Song' : 'Save Song' }}</span>
      </button>
    </div>

  </form>

</div>
